# Release: pushing a version tag (v0.2.0) builds the macOS .dmg and .zip (arm64 + x64) and uploads them, with the
# latest-mac.yml the in-app updater reads, to a DRAFT GitHub release. Nothing is public until someone publishes the
# draft on GitHub. See docs/RELEASING.md (signing and notarization are off until a Developer ID exists).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }

      - name: Install
        run: npm ci && node node_modules/electron/install.js

      - name: Unit tests
        run: npm test && (cd cli && npm test)

      # Signed when the signing secrets exist (and "identity": null is gone from package.json, see docs/RELEASING.md);
      # otherwise ad-hoc signed, which runs on Apple Silicon after "Open Anyway" but cannot update itself in place.
      - name: Build and upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            if [ -n "$APPLE_API_KEY_BASE64" ]; then
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
            fi
            npm run release
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            npm run release:adhoc
          fi
